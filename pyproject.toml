[project]
name = "j-regulator"
version = "0.1.0"
description = "AI model-routing and task-continuity system"
authors = [
    { name = "Gemini CLI", email = "gemini-cli@example.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.31.0",
    "typer>=0.12.5",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "httpx>=0.27.2",
    "rich>=13.9.2",
]

[project.scripts]
jreg = "jreg.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 88
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.6.9",
    "pytest-asyncio>=0.24.0",
]
